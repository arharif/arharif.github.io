name: CI

on:
  pull_request:
  push:
    branches: ['main', 'codex/**']

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          check-latest: false
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          X1_ALL_BROWSERS: '1'
      - name: Retain browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
      - run: npm audit --omit=dev --audit-level=high

  publisher-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect public publisher references
        continue-on-error: true
        run: npm run check:standard-sources
      - name: Retain publisher review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-publisher-review
          path: test-results/standards-source-review.json
          retention-days: 14
